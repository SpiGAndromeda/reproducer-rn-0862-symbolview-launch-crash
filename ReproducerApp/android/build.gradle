buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The SDK, build-tools and Kotlin versions come from the Expo version catalog
// rather than an `ext` block, so they stay consistent with the versions the
// pinned Expo module set was built against.
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
